<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Smart App Banner. "Open" passes this page's URL, so a /mix page opens that mix in the app. -->
    <meta name="apple-itunes-app" content="app-id=897414345">
    <script>
      document.querySelector('meta[name="apple-itunes-app"]').content += `, app-argument=${location.href}`;
    </script>
    <meta name="description" content="{{ site.description }}">
    <meta name="keywords" content="gradient wallpapers, iPhone wallpapers, iPad wallpapers, mobile wallpapers, gradient generator, wallpaper app">

    <!-- Mobile Web App Capable -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:description" content="{{ site.description }}">
    <meta property="og:image" content="https://gradiently.app/assets/images/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">

    <title>{{ page.title }}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='gGradient' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%230038A8;stop-opacity:1' /%3E%3Cstop offset='50%25' style='stop-color:%239B4F96;stop-opacity:1' /%3E%3Cstop offset='100%25' style='stop-color:%23D60270;stop-opacity:1' /%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='40' fill='url(%23gGradient)'/%3E%3Cpath d='M50 20 C35 20, 20 35, 20 50 C20 65, 35 80, 50 80 C65 80, 80 65, 80 50 C80 35, 65 20, 50 20 Z M50 30 C40 30, 30 40, 30 50 C30 60, 40 70, 50 70 C60 70, 70 60, 70 50 C70 40, 60 30, 50 30 Z M50 40 C45 40, 40 45, 40 50 C40 55, 45 60, 50 60 C55 60, 60 55, 60 50 C60 45, 55 40, 50 40 Z M50 50 L50 45 M50 50 L65 50' stroke='white' stroke-width='3' stroke-linecap='round' fill='none' opacity='0.9'/%3E%3C/svg%3E">

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | bust_css_cache }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    {% if page.homepage %}
    <link rel="stylesheet" href="{{ "/assets/css/home.css" | bust_file_cache }}">
    {% endif %}
    <script>
    console.log('%c🌈 Gradiently', 'font-size: 24px; color: #8b5cf6; font-weight: bold;');
    console.log('%cCreate beautiful gradient wallpapers! 🎨', 'font-size: 16px; color: #a855f7;');
    </script>
</head>
    <body{% unless page.homepage %} class="bg-white text-gray-900 min-h-screen dark:bg-gray-900 dark:text-gray-100"{% endunless %}>
        {{ content }}
    </body>
</html>
